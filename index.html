<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b5b7c">
  <title>Dienstplan</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Rote Meldungsleiste. Fehler werden nie verschluckt. -->
  <div id="fehler" class="fehler" hidden role="alert">
    <span id="fehler-text"></span>
    <button type="button" id="fehler-zu" aria-label="Meldung schließen">×</button>
  </div>

  <!-- 1: Anmeldung ---------------------------------------------------- -->
  <section id="ansicht-anmeldung" class="ansicht" hidden>
    <div class="mitte">
      <h1>Dienstplan</h1>
      <p class="hinweis">Bitte das Team-Passwort eingeben.</p>
      <form id="form-anmeldung">
        <label for="passwort">Team-Passwort</label>
        <input type="password" id="passwort" autocomplete="current-password" required>
        <button type="submit" id="knopf-anmelden">Anmelden</button>
      </form>
    </div>
  </section>

  <!-- 2: Namensauswahl ------------------------------------------------ -->
  <section id="ansicht-person" class="ansicht" hidden>
    <div class="mitte">
      <h1>Wer bist du?</h1>
      <p class="hinweis">Damit du deine eigenen Dienste siehst.</p>
      <ul id="liste-personen" class="liste-auswahl"></ul>
      <button type="button" class="verweis" id="knopf-abmelden-person">abmelden</button>
    </div>
  </section>

  <!-- 3: Die App ------------------------------------------------------ -->
  <section id="ansicht-app" class="ansicht" hidden>

    <main>
      <!-- Reiter 1 -->
      <div id="tab-meine" class="tab" hidden>
        <h1>Meine Dienste</h1>
        <div id="meine-inhalt" class="lade">Lade…</div>
      </div>

      <!-- Reiter 2 -->
      <div id="tab-eintragen" class="tab" hidden>
        <h1>Eintragen</h1>
        <p class="leiste">
          <button type="button" class="verweis" id="knopf-praeferenzen">Meine Präferenzen</button>
        </p>
        <div id="eintragen-inhalt" class="lade">Lade…</div>
      </div>

      <!-- Reiter 3 -->
      <div id="tab-plan" class="tab" hidden>
        <h1>Plan</h1>
        <div id="plan-inhalt" class="lade">Lade…</div>
      </div>

      <!-- Reiter 4, nur Admin -->
      <div id="tab-verwaltung" class="tab" hidden>
        <h1>Verwaltung</h1>
        <div class="unterreiter">
          <button type="button" data-unter="ampel" class="aktiv">Ampel</button>
          <button type="button" data-unter="personen">Personen</button>
          <button type="button" data-unter="termine">Termine</button>
        </div>
        <div id="verwaltung-inhalt" class="lade">Lade…</div>
        <button type="button" class="verweis admin-sperren" id="knopf-admin-sperren">Adminbereich wieder verbergen</button>
      </div>

      <footer id="fusszeile">
        Angemeldet als <strong id="fuss-name">–</strong> ·
        <button type="button" class="verweis" id="knopf-wechseln">wechseln</button> ·
        <button type="button" class="verweis" id="knopf-abmelden">abmelden</button>
      </footer>
    </main>

    <nav id="reiter">
      <button type="button" data-tab="meine" class="aktiv">Meine Dienste</button>
      <button type="button" data-tab="eintragen">Eintragen</button>
      <button type="button" data-tab="plan">Plan</button>
      <button type="button" data-tab="verwaltung" id="reiter-verwaltung" hidden>Verwaltung</button>
    </nav>
  </section>

  <!-- Overlay: Präferenzen -------------------------------------------- -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-karte" role="dialog" aria-modal="true" aria-labelledby="overlay-titel">
      <header>
        <h2 id="overlay-titel">Meine Präferenzen</h2>
        <button type="button" id="overlay-zu" aria-label="Fertig – Änderungen sind gespeichert">✓</button>
      </header>
      <div id="overlay-inhalt"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
