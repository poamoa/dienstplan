name: Nächtliches Backup

# Der kostenlose Supabase-Plan hat KEINE automatischen Backups.
# Dieser Job zieht jede Nacht einen Datenbank-Export und legt ihn in ein
# SEPARATES, PRIVATES Repo (poamoa/dienstplan-backups). Wichtig: Dieses Repo
# hier ist öffentlich (für GitHub Pages) – Backups mit echten Namen dürfen
# hier NICHT landen. Deshalb der Umweg über das private Repo.
#
# Zugriff aufs private Repo über einen Deploy-Key (SSH), der nicht abläuft:
#   - privater Schlüssel: Secret BACKUP_DEPLOY_KEY (hier)
#   - öffentlicher Schlüssel: Deploy-Key mit Schreibrecht am Backup-Repo
# Benötigte Secrets: SUPABASE_DB_URL (Session-Pooler), BACKUP_DEPLOY_KEY
# Siehe docs/05-betrieb-wartung.md

on:
  schedule:
    - cron: "30 2 * * *"    # täglich 2:30 UTC
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: PostgreSQL-Client installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Deploy-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BACKUP_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Privates Backup-Repo klonen
        run: git clone git@github.com:poamoa/dienstplan-backups.git repo

      - name: Export erstellen
        run: |
          mkdir -p repo/backups
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --no-owner --no-privileges \
            --file="repo/backups/dienstplan-$(date +%F).sql"

      - name: Alte Backups aufräumen (nur die letzten 30 behalten)
        run: |
          cd repo/backups
          ls -1t *.sql 2>/dev/null | tail -n +31 | xargs -r rm --

      - name: Ins private Repo einchecken
        run: |
          cd repo
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup $(date +%F)"
          git push
